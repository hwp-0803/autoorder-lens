name: Refresh FRED observations and model snapshots
on:
  schedule:
    - cron: '13 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fred-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/sync_fred.py
      - name: Commit only when official source changes
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No official data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fred_UBTPNO.csv data/forecasts_AR3_AR6.csv data/monitoring_AR3.csv data/latest_status.json
          git commit -m "data: refresh official FRED and model snapshots"
          git push origin HEAD:main
